<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark is the product's own chart reduced to a glyph: the wedge between a
    flat control arm and a treated one rising away from it. That gap is the
    lift, which is the only thing this system claims.

    Drawn as a filled shape rather than two strokes. Strokes were the obvious
    first attempt and they failed the only test that matters for a favicon —
    at 16px the two lines merged into one thick slash and the gap, the entire
    idea, disappeared. A filled wedge keeps its silhouette all the way down.

    Blue to green because that is the palette's own story: treatment on the
    left, recovered on the right.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8ae8"/>
      <stop offset="100%" stop-color="#159c6c"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#tile)"/>

  <!-- The lift: bounded above by the treated arm, below by the control arm. -->
  <path d="M6.5 22.8 L13 19.8 L18.2 13 L25.5 6.6 L25.5 21.4 Z"
        fill="#ffffff" fill-opacity="0.92"/>

  <!-- The treated arm itself, brighter, so the wedge has a leading edge at
       larger sizes. It merges into the fill when the icon is small, which is
       the intended behaviour rather than a compromise. -->
  <path d="M6.5 22.8 L13 19.8 L18.2 13 L25.5 6.6"
        stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
