<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!--
    RecoverOS pipeline.

    Colours are chosen to read on both GitHub's light and dark themes: mid-tone
    strokes and fills, no pure white or pure black, and every label carries its
    own contrast rather than relying on the page background.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b94"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .box   { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .core  { fill: #172554; stroke: #3b82f6; stroke-width: 1.5; }
      .guard { fill: #422006; stroke: #d97706; stroke-width: 1.5; }
      .sim   { fill: #1a2e05; stroke: #65a30d; stroke-width: 1.5; }
      .title { fill: #f1f5f9; font-size: 14px; font-weight: 600; }
      .sub   { fill: #94a3b8; font-size: 11px; }
      .lbl   { fill: #8b8b94; font-size: 11px; font-style: italic; }
      .hdr   { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .mono  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="#0f172a"/>

  <text x="32" y="40" class="title" font-size="18">RecoverOS — one case, end to end</text>
  <text x="32" y="62" class="sub">The LLM never touches a rupee. It writes templates; everything numeric is computed in Python and SQL.</text>

  <!-- ── inputs ─────────────────────────────────────────────── -->
  <text x="32" y="108" class="hdr">INPUT</text>

  <rect x="32" y="122" width="176" height="62" class="box"/>
  <text x="48" y="146" class="title">Failed payment</text>
  <text x="48" y="166" class="sub mono">error_source · error_step</text>

  <rect x="32" y="200" width="176" height="62" class="box"/>
  <text x="48" y="224" class="title">Overdue invoice</text>
  <text x="48" y="244" class="sub mono">days_overdue</text>

  <!-- ── detector ───────────────────────────────────────────── -->
  <rect x="32" y="300" width="176" height="76" class="core"/>
  <text x="48" y="324" class="title">detector</text>
  <text x="48" y="343" class="sub">z-scores each issuer</text>
  <text x="48" y="359" class="sub">against its own baseline</text>

  <!-- ── classifier ─────────────────────────────────────────── -->
  <text x="264" y="108" class="hdr">DECIDE</text>

  <rect x="264" y="122" width="200" height="140" class="core"/>
  <text x="280" y="146" class="title">classifier</text>
  <text x="280" y="166" class="sub">decision table, zero LLM</text>
  <text x="280" y="192" class="sub mono">bank/gateway → retry</text>
  <text x="280" y="209" class="sub mono">customer    → nudge</text>
  <text x="280" y="226" class="sub mono">internal    → human</text>
  <text x="280" y="250" class="sub">rule order is load-bearing</text>

  <rect x="264" y="300" width="200" height="76" class="core"/>
  <text x="280" y="324" class="title">ladder</text>
  <text x="280" y="343" class="sub">cheapest useful rung</text>
  <text x="280" y="359" class="sub">tier 0 → 1 → 2 → 3 → 4</text>

  <!-- ── policy engine ──────────────────────────────────────── -->
  <text x="520" y="108" class="hdr">GATE</text>

  <rect x="520" y="122" width="212" height="254" class="guard"/>
  <text x="536" y="146" class="title">policy engine</text>
  <text x="536" y="165" class="sub">all 11 evaluated, every time</text>

  <g class="mono" font-size="10.5" fill="#fbbf24">
    <text x="536" y="192">G01  consent</text>
    <text x="536" y="209">G02  quiet hours</text>
    <text x="536" y="226">G03  frequency cap</text>
    <text x="536" y="243">G04  attempt cap</text>
    <text x="536" y="260">G05  cooldown</text>
    <text x="536" y="277">G06  amount band</text>
    <text x="536" y="294">G07  risk hold</text>
    <text x="536" y="311">G08  issuer health</text>
    <text x="536" y="328">G09  duplicate payment</text>
    <text x="536" y="345">G10  stopping rule</text>
    <text x="536" y="362">G11  ladder order</text>
  </g>

  <!-- ── executor / llm ─────────────────────────────────────── -->
  <text x="788" y="108" class="hdr">ACT</text>

  <rect x="788" y="122" width="180" height="112" class="box"/>
  <text x="804" y="146" class="title">LLM</text>
  <text x="804" y="166" class="sub">drafts a template only</text>
  <text x="804" y="188" class="sub mono" fill="#a78bfa">"{{amount}} pending"</text>
  <text x="804" y="212" class="sub">cached per class/tier/lang</text>

  <rect x="788" y="252" width="180" height="72" class="guard"/>
  <text x="804" y="276" class="title">validator</text>
  <text x="804" y="295" class="sub">rejects any literal digit</text>
  <text x="804" y="311" class="sub">→ deterministic fallback</text>

  <rect x="788" y="342" width="180" height="72" class="box"/>
  <text x="804" y="366" class="title">executor</text>
  <text x="804" y="385" class="sub">renders from the database</text>
  <text x="804" y="401" class="sub">mints a Razorpay link</text>

  <!-- ── ledger ─────────────────────────────────────────────── -->
  <rect x="264" y="440" width="704" height="70" class="core"/>
  <text x="280" y="466" class="title">audit ledger — SHA-256 hash-chained, append-only</text>
  <text x="280" y="488" class="sub">every classification, every gate verdict, every draft and its validation, every send, every outcome</text>

  <!-- ── oracle / measurement ───────────────────────────────── -->
  <rect x="32" y="440" width="200" height="70" class="sim"/>
  <text x="48" y="466" class="title">outcome oracle</text>
  <text x="48" y="488" class="sub">the agent cannot read it</text>

  <rect x="32" y="546" width="936" height="82" class="sim"/>
  <text x="48" y="572" class="title">measurement — 20% control arm, never contacted</text>
  <text x="48" y="594" class="sub">one random draw per case; each delivered touch lowers the bar it must clear, so lift is not an artefact of extra attempts</text>
  <text x="48" y="614" class="sub">net lift with a 95% confidence interval, per recovery class, plus the honest list of everything not recovered</text>

  <!-- ── flows ──────────────────────────────────────────────── -->
  <g fill="none" stroke="#8b8b94" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 208 153 L 258 153"/>
    <path d="M 208 231 L 240 231 L 240 175 L 258 175"/>
    <path d="M 364 262 L 364 294"/>
    <!-- Issuer health feeds G08 inside the policy engine, not the classifier:
         it decides whether a retry is worth attempting, not what kind of
         failure this is. -->
    <path d="M 208 338 L 228 338 L 228 398 L 592 398 L 592 380" stroke-dasharray="4 3"/>
  </g>

  <g fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)">
    <path d="M 464 338 L 492 338 L 492 249 L 514 249"/>
    <path d="M 732 200 L 782 200"/>
    <path d="M 878 234 L 878 246"/>
    <path d="M 878 324 L 878 336"/>
  </g>

  <g fill="none" stroke="#65a30d" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 878 414 L 878 428 L 700 428 L 700 436"/>
    <path d="M 132 510 L 132 540"/>
  </g>

  <g fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAmber)" stroke-dasharray="5 3">
    <path d="M 660 380 L 660 416 L 460 416 L 460 436"/>
  </g>

  <text x="742" y="192" class="lbl">allowed</text>
  <text x="238" y="392" class="lbl" font-size="10">issuer health → G08</text>
  <text x="404" y="428" class="lbl" fill="#d97706" font-size="10">blocked — recorded with the full gate trail</text>
</svg>
